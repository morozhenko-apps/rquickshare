name: Reissue signed rQuickShare APT metadata (manual)

# Metadata-only migration/recovery: no unattended signing or R2 writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rquickshare-signed-apt
  cancel-in-progress: false

jobs:
  refresh:
    name: Sign and conditionally renew the existing APT snapshot
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: apt-release
    timeout-minutes: 45
    env:
      SIGNING_FINGERPRINT: 6D8854762CF0C86881138A56695A0888D09FA616
      RQS_R2_ACCOUNT_ID: ${{ vars.RQS_R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned SDK for authenticated R2 selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rqs-refresh-python"
          "$RUNNER_TEMP/rqs-refresh-python/bin/python" -m pip install -r scripts/requirements-r2.txt
      - name: Select published source tag from protected R2
        env:
          RQS_R2_ACCESS_KEY_ID: ${{ secrets.RQS_R2_ACCESS_KEY_ID }}
          RQS_R2_SECRET_ACCESS_KEY: ${{ secrets.RQS_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RQS_R2_ACCESS_KEY_ID" || -z "$RQS_R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Protected R2 read credentials are missing"
            exit 1
          fi
          tag="$("$RUNNER_TEMP/rqs-refresh-python/bin/python" scripts/native_ci_archive.py \
            --account-id "$RQS_R2_ACCOUNT_ID" --select-tag)"
          if [[ -z "$tag" ]]; then
            echo "::error::No published APT authority to reissue"
            exit 1
          fi
          python3 scripts/native_release_tag.py version "$tag" >/dev/null
          printf 'TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - name: Validate released tag before executing reviewed master tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native_release_tag.py version "$TAG" >/dev/null
          git fetch origin master "refs/tags/$TAG:refs/tags/$TAG"
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" "origin/master^{commit}"
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse origin/master^{commit})"
          echo "RELEASE_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_ENV"
          source_version="$(git show "refs/tags/$TAG^{commit}:native_desktop/Cargo.toml" |
            python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')"
          [[ "$(python3 scripts/native_release_tag.py tag "$source_version")" == "$TAG" ]] || exit 1
      - name: Import protected release signing subkey only
        env:
          KEYRING_B64: ${{ secrets.RQS_APT_PUBLIC_KEYRING_BASE64 }}
          SUBKEY_B64: ${{ secrets.RQS_APT_SECRET_SUBKEY_BASE64 }}
          SUBKEY_PASSPHRASE: ${{ secrets.RQS_APT_SUBKEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYRING_B64" && -n "$SUBKEY_B64" && -n "$SUBKEY_PASSPHRASE" ]] || exit 1
          umask 077
          private="$RUNNER_TEMP/rqs-refresh-private"
          mkdir -m 700 "$private" "$private/gnupg"
          printf '%s' "$KEYRING_B64" | base64 --decode > "$private/keyring.gpg"
          printf '%s' "$SUBKEY_B64" | base64 --decode > "$private/import.gpg"
          printf '%s' "$SUBKEY_PASSPHRASE" > "$private/passphrase"
          gpg --no-options --homedir "$private/gnupg" --batch --import "$private/import.gpg" >/dev/null 2>&1
          rm -f "$private/import.gpg"
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); import native_apt as apt; apt.public_key(Path(sys.argv[1]), sys.argv[2])' \
            "$private/keyring.gpg" "$SIGNING_FINGERPRINT"
          gpg --no-options --homedir "$private/gnupg" --batch --with-colons --list-secret-keys \
            "$SIGNING_FINGERPRINT" > "$private/keys.txt"
          python3 scripts/native_ci_signing_key.py --listing "$private/keys.txt" --fingerprint "$SIGNING_FINGERPRINT"
          rm -f "$private/keys.txt"
      - name: Authenticate current R2 and regenerate the same package metadata
        env:
          RQS_R2_ACCESS_KEY_ID: ${{ secrets.RQS_R2_ACCESS_KEY_ID }}
          RQS_R2_SECRET_ACCESS_KEY: ${{ secrets.RQS_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RQS_R2_ACCESS_KEY_ID" || -z "$RQS_R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Protected R2 restore credentials are missing"
            exit 1
          fi
          py="$RUNNER_TEMP/rqs-refresh-python/bin/python"
          echo "::notice::Restoring the authenticated previous signed archive"
          if ! "$py" scripts/native_ci_archive.py --account-id "$RQS_R2_ACCOUNT_ID" \
            --keyring "$RUNNER_TEMP/rqs-refresh-private/keyring.gpg" \
            --fingerprint "$SIGNING_FINGERPRINT" --output "$RUNNER_TEMP/rqs-previous" \
            > "$RUNNER_TEMP/rqs-refresh-baseline"; then
            echo "::error::Previous signed archive recovery failed; publication blocked"
            exit 1
          fi
          baseline="$(cat "$RUNNER_TEMP/rqs-refresh-baseline")"
          if [[ "$baseline" != "previous" ]]; then
            echo "::error::Expected an existing authenticated APT archive; publication blocked"
            exit 1
          fi
          echo "::notice::Previous signed archive authenticated"
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/rqs-previous/linux/*.deb)
          echo "::notice::Recovered package count: ${#packages[@]}"
          if [[ "${#packages[@]}" -lt 1 || "${#packages[@]}" -gt 2 ]]; then
            echo "::error::Unexpected recovered native package count; publication blocked"
            exit 1
          fi
          args=()
          for package in "${packages[@]}"; do args+=(--package "$package"); done
          echo "::notice::Rebuilding unsigned APT metadata from authenticated packages"
          python3 scripts/native_apt.py prepare "${args[@]}" --output "$RUNNER_TEMP/rqs-renew-unsigned"
          private="$RUNNER_TEMP/rqs-refresh-private"
          echo "::notice::Signing migrated APT metadata with protected subkey"
          python3 scripts/native_apt.py sign --repository "$RUNNER_TEMP/rqs-renew-unsigned" \
            --output "$RUNNER_TEMP/rqs-renew-signed" \
            --keyring "$private/keyring.gpg" --fingerprint "$SIGNING_FINGERPRINT" \
            --gnupghome "$private/gnupg" --passphrase-file "$private/passphrase" \
            --previous "$RUNNER_TEMP/rqs-previous"
          echo "::notice::Verifying the regenerated signed archive"
          python3 scripts/native_apt.py verify --repository "$RUNNER_TEMP/rqs-renew-signed" \
            --keyring "$private/keyring.gpg" --fingerprint "$SIGNING_FINGERPRINT" \
            --previous "$RUNNER_TEMP/rqs-previous"
      - name: Publish a fresh signed InRelease using conditional R2 CAS
        env:
          RQS_R2_ACCESS_KEY_ID: ${{ secrets.RQS_R2_ACCESS_KEY_ID }}
          RQS_R2_SECRET_ACCESS_KEY: ${{ secrets.RQS_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rqs-refresh-python/bin/python" scripts/native_r2.py publish \
            --repository "$RUNNER_TEMP/rqs-renew-signed" \
            --keyring "$RUNNER_TEMP/rqs-refresh-private/keyring.gpg" \
            --fingerprint "$SIGNING_FINGERPRINT" --account-id "$RQS_R2_ACCOUNT_ID" \
            --previous "$RUNNER_TEMP/rqs-previous" \
            --commit "$RELEASE_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/refresh-receipt.json"
          curl -fsS "https://download.morozhenko.com/dist/rQuickShare/linux/InRelease" \
            -o "$RUNNER_TEMP/rqs-renew-public-InRelease"
          cmp "$RUNNER_TEMP/rqs-renew-public-InRelease" \
              "$RUNNER_TEMP/rqs-renew-signed/linux/InRelease"
      - name: Cleanup runner-local protected signing material
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/rqs-refresh-private/gnupg" ]]; then
            gpgconf --homedir "$RUNNER_TEMP/rqs-refresh-private/gnupg" --kill gpg-agent || true
          fi
          rm -rf "$RUNNER_TEMP/rqs-refresh-private" "$RUNNER_TEMP/rqs-previous" \
                 "$RUNNER_TEMP/rqs-renew-unsigned" "$RUNNER_TEMP/rqs-renew-signed"
