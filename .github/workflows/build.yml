name: Package smoke

on:
  workflow_dispatch:

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux_package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@9.7.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             protobuf-compiler             libdbus-1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev             libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Build debug package
        working-directory: ./app/main
        run: pnpm build:debug

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: rquickshare-linux-debug
          path: |
            ${{ github.workspace }}/app/main/src-tauri/target/debug/bundle/**/*.deb
            ${{ github.workspace }}/app/main/src-tauri/target/debug/bundle/**/*.AppImage
            ${{ github.workspace }}/app/main/src-tauri/target/debug/bundle/**/*.rpm
          if-no-files-found: error
