name: Linux package smoke

# Manual package gate. Normal dev commits must not build Tauri packages.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-smoke
  cancel-in-progress: true

jobs:
  linux_package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@9.7.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "app/main/src-tauri -> target"
          shared-key: linux-package-smoke

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Build debug Debian package
        working-directory: ./app/main
        run: pnpm exec tauri build --debug --bundles deb

      - name: Validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t DEBS < <(find app/main/src-tauri/target/debug/bundle -type f -name '*.deb' -print)
          test "${#DEBS[@]}" -gt 0
          for deb in "${DEBS[@]}"; do
            echo "=== $deb ==="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | head -n 80
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: rquickshare-linux-debug
          path: app/main/src-tauri/target/debug/bundle/**/*.deb
          if-no-files-found: error
