name: Feature Linux package smoke

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/feature-package-smoke.yml"

permissions:
  contents: read

concurrency:
  group: feature-package-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux_package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@9.7.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Build debug Linux bundles
        working-directory: ./app/main
        run: pnpm build:debug

      - name: Validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t DEBS < <(find app/main/src-tauri/target/debug/bundle -type f -name '*.deb' -print)
          test "${#DEBS[@]}" -gt 0
          for deb in "${DEBS[@]}"; do
            echo "=== $deb ==="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | head -n 80
          done

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v6
        with:
          name: rquickshare-pixel-ble-linux-debug
          path: |
            app/main/src-tauri/target/debug/bundle/**/*.deb
            app/main/src-tauri/target/debug/bundle/**/*.AppImage
            app/main/src-tauri/target/debug/bundle/**/*.rpm
          if-no-files-found: error
