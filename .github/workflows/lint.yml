name: Code quality

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust_format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - ./core_lib
          - ./app/main/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: ${{ matrix.directory }}
        run: cargo fmt --all --check

  frontend_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ./app/main
        run: pnpm lint
      - name: Type check
        working-directory: ./app/main
        run: pnpm ts-check
      - name: Unit tests
        working-directory: ./app/main
        run: pnpm exec vitest run

  clippy:
    strategy:
      matrix:
        include:
          - directory: core_lib
            clippy_args: "--all-features --all"
            os: ubuntu-latest
          - directory: app/main/src-tauri
            clippy_args: "--no-default-features"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "${{ github.workspace }}/${{ matrix.directory }}/target"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Ubuntu 24.04 WebKit dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
      - name: Clippy
        working-directory: ${{ matrix.directory }}
        run: cargo clippy ${{ matrix.clippy_args }}
