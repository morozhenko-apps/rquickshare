name: Preflight

# CFVigil-style deliberate development verification.
# Code and docs pushes do not start CI; only marker changes or PRs do.
on:
  push:
    branches: [dev]
    paths:
      - 'ci/run-preflight.txt'
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Resolve PR test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preflight: ${{ steps.classify.outputs.preflight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect executable changes using the PR merge diff
        id: classify
        run: bash scripts/ci-pr-scope.sh

  rust_format:
    needs: scope
    if: needs.scope.outputs.preflight == 'true'
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: ./app/main/src-tauri
        run: cargo fmt --all --check

      - name: Validate receiver A/B smoke launcher
        run: |
          bash -n scripts/receiver-ab-smoke.sh
          bash scripts/receiver-ab-smoke.sh --help >/dev/null
          if bash scripts/receiver-ab-smoke.sh unknown >/dev/null 2>&1; then
            echo "Unknown A/B mode must fail" >&2
            exit 1
          fi

      - name: Enforce fast development and protected release workflow cadence
        run: bash scripts/ci-check-workflow-policy.sh

      - name: Validate stable/race-sensitive CI group inventory script
        run: |
          bash -n scripts/ci-core-test-groups.sh
          bash scripts/ci-core-test-groups.sh --help >/dev/null
          if bash scripts/ci-core-test-groups.sh unknown >/dev/null 2>&1; then
            echo "Unknown core CI test group must fail" >&2
            exit 1
          fi
          test "$(bash scripts/ci-core-test-groups.sh list | wc -l)" -eq 8

      - name: Offline Python contract tests with pinned publication dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/native-publication-python"
          "$RUNNER_TEMP/native-publication-python/bin/python" -m pip install -r scripts/requirements-ci.txt
          "$RUNNER_TEMP/native-publication-python/bin/python" -m unittest discover -s scripts/tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Flat distribution and receipt cleanup contracts
        run: node --test scripts/tests/*.test.mjs

  frontend:
    needs: scope
    if: needs.scope.outputs.preflight == 'true'
    name: Frontend lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@9.7.0

      - name: Install dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./app/main
        run: pnpm lint

      - name: Type check
        working-directory: ./app/main
        run: pnpm ts-check

      - name: Unit tests
        working-directory: ./app/main
        run: pnpm exec vitest run

  core_tests:
    needs: scope
    if: needs.scope.outputs.preflight == 'true'
    name: Core Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core_lib -> target
          shared-key: preflight-core-tests
          save-if: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}

      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler dbus-daemon libdbus-1-dev

      - name: Run stable Core Rust tests once
        run: bash scripts/ci-core-test-groups.sh stable

  clippy:
    needs: scope
    if: needs.scope.outputs.preflight == 'true'
    name: Clippy (${{ matrix.directory }})
    strategy:
      matrix:
        include:
          - directory: core_lib
            clippy_args: "--all-features --all-targets"
            os: ubuntu-latest
          - directory: app/main/src-tauri
            clippy_args: "--no-default-features --all-targets"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ matrix.directory }} -> target
          shared-key: preflight-clippy-${{ matrix.directory }}
          save-if: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Tauri WebKit dependencies
        if: matrix.directory == 'app/main/src-tauri'
        run: |
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Clippy
        working-directory: ${{ matrix.directory }}
        run: cargo +stable clippy --locked ${{ matrix.clippy_args }} -- -D warnings

      - name: Desktop Rust unit tests
        if: matrix.directory == 'app/main/src-tauri'
        working-directory: ./app/main/src-tauri
        run: cargo +stable test --locked --no-default-features --bin rquickshare

  admission:
    name: Preflight admission
    if: always()
    needs: [scope, rust_format, frontend, core_tests, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      PREFLIGHT_REQUIRED: ${{ needs.scope.outputs.preflight }}
      RUST_RESULT: ${{ needs.rust_format.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      CORE_RESULT: ${{ needs.core_tests.result }}
      CLIPPY_RESULT: ${{ needs.clippy.result }}
    steps:
      - name: Require exact applicable suite outcomes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          case "$PREFLIGHT_REQUIRED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$RUST_RESULT" "$FRONTEND_RESULT" "$CORE_RESULT" "$CLIPPY_RESULT"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
