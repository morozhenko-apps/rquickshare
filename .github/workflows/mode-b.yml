name: Mode B validation

on:
  push:
    tags:
      - "mode-b-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mode-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full_suite:
    name: Complete automated suite 10x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Run complete suite ten consecutive times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "=== Mode B attempt ${attempt}/10: Rust ==="
            (
              cd core_lib
              cargo test --all-features
            )

            echo "=== Mode B attempt ${attempt}/10: frontend ==="
            (
              cd app/main
              pnpm exec vitest run
            )
          done
