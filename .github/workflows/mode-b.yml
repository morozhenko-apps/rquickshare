name: Mode B validation

on:
  push:
    tags:
      - "mode-b-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mode-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stable:
    name: Stable suite 1x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Rust stable suite
        working-directory: ./core_lib
        run: cargo test --all-features

      - name: Frontend stable suite
        working-directory: ./app/main
        run: pnpm exec vitest run

  stability:
    name: Async transport/BWU 10x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev

      - name: Run stability-sensitive tests ten times
        working-directory: ./core_lib
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "=== stability attempt ${attempt}/10 ==="
            cargo test --all-features ble_transport_round_trip -- --nocapture
            cargo test --all-features plaintext_bwu_frame_round_trip -- --nocapture
            cargo test --all-features routes_bwu_socket_without_consuming_client_introduction -- --nocapture
          done
