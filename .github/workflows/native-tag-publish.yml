name: Publish rQuickShare

on:
  push:
    tags: ["native/v*"]

permissions:
  contents: read

concurrency:
  group: rquickshare-signed-apt
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # A matching commit alone cannot establish protected release authority.
      # Fail before build/signing if production master has no effective protection.
      - name: Require protected production master before accepting a release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches/master" --jq '.protected' |
            grep -Fxq true
      - name: Confirm stable tag equals current master and native version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/native_release_tag.py version "$GITHUB_REF_NAME")"
          # checkout@v5 may replace its local tag ref with a commit checkout.
          # Fetch the remote annotated tag object into an independent validation ref.
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/release-validation/native-tag"
          test "$(git cat-file -t refs/release-validation/native-tag)" = tag
          [[ "$(git rev-parse refs/release-validation/native-tag^{commit})" == "$GITHUB_SHA" ]] || exit 1
          git fetch --no-tags origin master
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master^{commit})" ]] || exit 1
          test "$(python3 scripts/native_release_tag.py tag "$version")" = "$GITHUB_REF_NAME"
          actual="$(python3 -c 'import tomllib; print(tomllib.load(open("native_desktop/Cargo.toml", "rb"))["package"]["version"])')"
          revision="$(python3 -c 'import tomllib; print(tomllib.load(open("native_desktop/packaging/release.toml", "rb"))["revision"])')"
          [[ "$version" == "$actual" && "$revision" =~ ^[1-9][0-9]{0,9}$ ]] || exit 1
          (( revision <= 2147483647 )) || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  package:
    # Pre-release QA/Mode B is completed and approved before tagging.
    # The tag pipeline verifies source identity, builds once, signs and publishes.
    needs: admission
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Install native ABI build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl build-essential pkg-config dpkg-dev python3 \
            protobuf-compiler libdbus-1-dev libudev-dev libgtk-4-dev libgtk4-layer-shell-dev \
            libfontconfig-dev libseccomp-dev bubblewrap glycin-loaders desktop-file-utils
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.0
        with:
          workspaces: |
            core_lib -> target
            native_desktop -> target
          shared-key: native-ubuntu-26.04
      - name: Build and verify native Debian package
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate native_desktop/packaging/share/applications/io.github.morozhenko_apps.RQuickShare.desktop
          # Build performs package manifest, dependency, ELF, checksum,
          # content/mode/owner, and isolated offline binary-smoke validation.
          python3 scripts/native_deb.py build --output "$RUNNER_TEMP/native-packages"
      - uses: actions/upload-artifact@v6
        with:
          name: native-package
          path: |
            ${{ runner.temp }}/native-packages/*.deb
            ${{ runner.temp }}/native-packages/*.deb.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [admission, package]
    environment: apt-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.admission.outputs.version }}
      REVISION: ${{ needs.admission.outputs.revision }}
      SIGNING_FINGERPRINT: 6D8854762CF0C86881138A56695A0888D09FA616
      RQS_R2_ACCOUNT_ID: ${{ vars.RQS_R2_ACCOUNT_ID }}
    outputs:
      receipt: ${{ steps.publish.outputs.receipt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: native-package
          path: ${{ runner.temp }}/native-package
      - name: Check exact artifact identity and public account configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RQS_R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || exit 1
          test -s "$RUNNER_TEMP/native-package/rquickshare-native_${VERSION}-${REVISION}_amd64.deb"
          test -s "$RUNNER_TEMP/native-package/rquickshare-native_${VERSION}-${REVISION}_amd64.deb.sha256"
      # The existing R2 Custom Domain serves the flat public files directly.
      # The publisher verifies public bytes before committing release metadata.
      - name: Prepare flat APT metadata from the single verified package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native_apt.py prepare \
            --package "$RUNNER_TEMP/native-package/rquickshare-native_${VERSION}-${REVISION}_amd64.deb" \
            --output "$RUNNER_TEMP/unsigned-apt"
      - name: Prepare isolated S3 SDK before importing any key
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/python" -m pip install -r scripts/requirements-r2.txt
      - name: Import encrypted signing subkey, forbid primary secret
        env:
          KEYRING_B64: ${{ secrets.RQS_APT_PUBLIC_KEYRING_BASE64 }}
          SUBKEY_B64: ${{ secrets.RQS_APT_SECRET_SUBKEY_BASE64 }}
          SUBKEY_PASSPHRASE: ${{ secrets.RQS_APT_SUBKEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYRING_B64" && -n "$SUBKEY_B64" && -n "$SUBKEY_PASSPHRASE" ]] || exit 1
          umask 077
          private="$RUNNER_TEMP/rqs-release-private"
          mkdir -m 700 "$private" "$private/gnupg"
          printf '%s' "$KEYRING_B64" | base64 --decode > "$private/keyring.gpg"
          printf '%s' "$SUBKEY_B64" | base64 --decode > "$private/import.gpg"
          printf '%s' "$SUBKEY_PASSPHRASE" > "$private/passphrase"
          gpg --no-options --homedir "$private/gnupg" --batch --import "$private/import.gpg" >/dev/null 2>&1
          rm -f "$private/import.gpg"
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); import native_apt as apt; apt.public_key(Path(sys.argv[1]), sys.argv[2])' \
            "$private/keyring.gpg" "$SIGNING_FINGERPRINT"
          gpg --no-options --homedir "$private/gnupg" --batch --with-colons --list-secret-keys \
            "$SIGNING_FINGERPRINT" > "$private/keys.txt"
          python3 scripts/native_ci_signing_key.py --listing "$private/keys.txt" --fingerprint "$SIGNING_FINGERPRINT"
          rm -f "$private/keys.txt"
      - name: Restore authenticated previous archive from private R2
        env:
          RQS_R2_ACCESS_KEY_ID: ${{ secrets.RQS_R2_ACCESS_KEY_ID }}
          RQS_R2_SECRET_ACCESS_KEY: ${{ secrets.RQS_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RQS_R2_ACCESS_KEY_ID" && -n "$RQS_R2_SECRET_ACCESS_KEY" ]] || exit 1
          baseline="$("$RUNNER_TEMP/release-python/bin/python" scripts/native_ci_archive.py \
            --account-id "$RQS_R2_ACCOUNT_ID" \
            --keyring "$RUNNER_TEMP/rqs-release-private/keyring.gpg" \
            --fingerprint "$SIGNING_FINGERPRINT" --output "$RUNNER_TEMP/previous-signed")"
          [[ "$baseline" == "first" || "$baseline" == "previous" ]] || exit 1
          echo "$baseline" > "$RUNNER_TEMP/apt-baseline"
      - name: Sign and verify the immutable Debian release
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/rqs-release-private"
          baseline=(--first-release)
          previous=()
          if [[ "$(cat "$RUNNER_TEMP/apt-baseline")" == "previous" ]]; then
            baseline=(--previous "$RUNNER_TEMP/previous-signed")
            previous=(--previous "$RUNNER_TEMP/previous-signed")
          fi
          python3 scripts/native_apt.py sign --repository "$RUNNER_TEMP/unsigned-apt" \
            --output "$RUNNER_TEMP/signed-apt" \
            --keyring "$private/keyring.gpg" --fingerprint "$SIGNING_FINGERPRINT" \
            --gnupghome "$private/gnupg" --passphrase-file "$private/passphrase" "${baseline[@]}"
          python3 scripts/native_apt.py verify --repository "$RUNNER_TEMP/signed-apt" \
            --keyring "$private/keyring.gpg" --fingerprint "$SIGNING_FINGERPRINT" "${previous[@]}"
      - name: Publish immutable R2 pool and by-hash, then conditional InRelease
        id: publish
        env:
          RQS_R2_ACCESS_KEY_ID: ${{ secrets.RQS_R2_ACCESS_KEY_ID }}
          RQS_R2_SECRET_ACCESS_KEY: ${{ secrets.RQS_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RQS_R2_ACCESS_KEY_ID" && -n "$RQS_R2_SECRET_ACCESS_KEY" ]] || exit 1
          baseline=(--first-release)
          if [[ "$(cat "$RUNNER_TEMP/apt-baseline")" == "previous" ]]; then
            baseline=(--previous "$RUNNER_TEMP/previous-signed")
          fi
          "$RUNNER_TEMP/release-python/bin/python" scripts/native_r2.py publish \
            --repository "$RUNNER_TEMP/signed-apt" \
            --keyring "$RUNNER_TEMP/rqs-release-private/keyring.gpg" \
            --fingerprint "$SIGNING_FINGERPRINT" --account-id "$RQS_R2_ACCOUNT_ID" "${baseline[@]}" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/publication-receipt.json"
          printf 'receipt=' >> "$GITHUB_OUTPUT"
          base64 -w0 "$RUNNER_TEMP/publication-receipt.json" >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"
      - name: Verify public HTTPS archive and actual isolated APT package acquisition
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.morozhenko.com/dist/rQuickShare/linux"
          curl -fsS "$base/InRelease" -o "$RUNNER_TEMP/public-InRelease"
          cmp "$RUNNER_TEMP/public-InRelease" "$RUNNER_TEMP/signed-apt/linux/InRelease"
          name="rquickshare-native_${VERSION}-${REVISION}_amd64.deb"
          curl -fsS "$base/$name" -o "$RUNNER_TEMP/public.deb"
          cmp "$RUNNER_TEMP/public.deb" "$RUNNER_TEMP/native-package/$name"
          private="$RUNNER_TEMP/rqs-release-private"
          python3 scripts/native_apt.py bootstrap --repository "$RUNNER_TEMP/signed-apt" \
            --keyring "$private/keyring.gpg" --fingerprint "$SIGNING_FINGERPRINT" \
            --output "$RUNNER_TEMP/apt-bootstrap"
          mkdir -p "$RUNNER_TEMP/isolated-apt/lists/partial" "$RUNNER_TEMP/isolated-apt/download"
          : > "$RUNNER_TEMP/isolated-apt/status"
          sed "s|/etc/apt/keyrings/rquickshare-native-archive-keyring.gpg|$private/keyring.gpg|" \
            "$RUNNER_TEMP/apt-bootstrap/rquickshare-native.sources" > "$RUNNER_TEMP/isolated-apt/source.sources"
          apt_flags=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/isolated-apt/source.sources"
            -o "Dir::Etc::sourceparts=-"
            -o "Dir::Etc::trusted=/dev/null"
            -o "Dir::Etc::trustedparts=-"
            -o "Dir::State::lists=$RUNNER_TEMP/isolated-apt/lists"
            -o "Dir::State::status=$RUNNER_TEMP/isolated-apt/status"
          )
          apt-get "${apt_flags[@]}" update -qq
          (cd "$RUNNER_TEMP/isolated-apt/download" && \
             apt-get "${apt_flags[@]}" download "rquickshare-native=${VERSION}-${REVISION}")
          cmp "$RUNNER_TEMP/isolated-apt/download/$name" "$RUNNER_TEMP/native-package/$name"
      - name: Clean runner-local signing material
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/rqs-release-private/gnupg" ]]; then
            gpgconf --homedir "$RUNNER_TEMP/rqs-release-private/gnupg" --kill gpg-agent || true
          fi
          rm -rf "$RUNNER_TEMP/rqs-release-private" "$RUNNER_TEMP/previous-signed" \
                 "$RUNNER_TEMP/signed-apt" "$RUNNER_TEMP/unsigned-apt"

  cleanup:
    needs: [admission, package, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Remove exact package archive after verified public R2 readback
        env:
          RECEIPT_BASE64: ${{ needs.publish.outputs.receipt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$RECEIPT_BASE64" | base64 --decode > "$RUNNER_TEMP/receipt.json"
          node scripts/cleanup-published-artifacts.mjs --verified-receipt "$RUNNER_TEMP/receipt.json"
          rm -f "$RUNNER_TEMP/receipt.json"

  github-release:
    needs: [admission, publish, cleanup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish text-only GitHub Release after signed R2 and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="Independent fork of Martichou/rquickshare (GPLv3). Ubuntu 26.04 amd64. Direct DEB and signed flat APT use identical bytes at https://download.morozhenko.com/dist/rQuickShare/linux/ . Latest verified download: https://download.morozhenko.com/dist/rQuickShare/latest.json . Windows and macOS are not shipped. No GitHub binary attachments."
          if [[ "$TAG" == "native/v0.9.0" ]]; then
            notes="$notes Early public Linux release with explicit device consent; BLE-to-TCP admission security review: https://github.com/morozhenko-apps/rquickshare/issues/8 ."
          fi
          if [[ "$TAG" == "native/v1.0.0" ]]; then
            notes="$notes Known limitations accepted for this release: BLE-to-TCP admission availability risk (https://github.com/morozhenko-apps/rquickshare/issues/8); authenticated grouping of unverified peer routes is not implemented (https://github.com/morozhenko-apps/rquickshare/issues/16). Neither issue is claimed fixed. Each incoming transfer still requires explicit consent."
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "rQuickShare ${TAG#native/v}" --notes "$notes"
