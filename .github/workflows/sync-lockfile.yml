name: Sync pnpm lockfile

on:
  push:
    branches: [ "dev" ]
    paths:
      - "app/main/package.json"

permissions:
  contents: write

concurrency:
  group: sync-pnpm-lock-dev
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Regenerate lockfile
        working-directory: ./app/main
        run: pnpm install --lockfile-only

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- app/main/pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches package.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main/pnpm-lock.yaml
          git commit -m "chore(deps): sync pnpm lockfile"
          git push origin HEAD:dev
