name: Release workflow contract check

# Deliberate one-off contract check. The CI cadence policy forbids dev push triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-syntax:
    name: Validate release GitHub Actions structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Install pinned release workflow validator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tools"
          GOBIN="$RUNNER_TEMP/release-tools" \
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate publication and ordinary CI workflows
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-tools/actionlint" \
            -config-file .github/actionlint.yaml \
            -shellcheck= -pyflakes= \
            .github/workflows/native-tag-publish.yml \
            .github/workflows/native-apt-refresh.yml \
            .github/workflows/lint.yml \
            .github/workflows/native-gtk-ui.yml
