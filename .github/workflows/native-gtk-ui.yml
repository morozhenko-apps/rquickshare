name: Native GTK UI verification

# Deliberate dev verification like CFVigil. A marker or relevant PR
# runs real GTK/Bubblewrap tests; ordinary pushes do not.
on:
  push:
    branches: [dev]
    paths:
      - 'ci/run-preflight.txt'
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gtk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Resolve native GTK PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gtk: ${{ steps.classify.outputs.gtk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect native production or CI changes
        id: classify
        run: bash scripts/ci-pr-scope.sh

  native_gtk:
    name: Native GTK widget tests and strict lint
    needs: scope
    if: needs.scope.outputs.gtk == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl build-essential pkg-config \
            protobuf-compiler libdbus-1-dev libudev-dev libgtk-4-dev \
            libgtk4-layer-shell-dev libfontconfig-dev libseccomp-dev \
            bubblewrap glycin-loaders dbus-daemon dbus-x11 xvfb xauth

      - name: Require real unprivileged Bubblewrap sandbox on native Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$VERSION_ID" = "26.04"
          test "$(id -u)" -ne 0
          # The real Glycin loader needs user, PID and mount namespaces.
          bwrap --die-with-parent --unshare-user --unshare-pid \
            --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            core_lib -> target
            native_desktop -> target
          shared-key: native-gtk-ui-ubuntu-26.04
          save-if: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}

      - name: Native GTK source formatting and lint
        run: |
          cargo +nightly fmt --manifest-path native_desktop/Cargo.toml -- --check
          cargo +stable clippy --locked --manifest-path native_desktop/Cargo.toml --all-targets --no-deps -- -D warnings

      - name: Native GTK stable library and widget suites once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/core_lib/target/native-ui-test-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/core_lib/target/native-ui-test-tmp"
          cargo +stable build --locked --manifest-path native_desktop/Cargo.toml --bin rquickshare-preview-helper
          GTK_A11Y=none GDK_BACKEND=x11 GSK_RENDERER=cairo \
            dbus-run-session --config-file docs/prototypes/preview-bus.conf -- \
            xvfb-run -a bash scripts/ci-native-gtk-test-groups.sh stable


  admission:
    name: Native GTK admission
    if: always()
    needs: [scope, native_gtk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      GTK_REQUIRED: ${{ needs.scope.outputs.gtk }}
      GTK_RESULT: ${{ needs.native_gtk.result }}
    steps:
      - name: Require native GTK success or an audited non-native skip
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          case "$GTK_REQUIRED" in
            true) [[ "$GTK_RESULT" == success ]] ;;
            false) [[ "$GTK_RESULT" == skipped ]] ;;
            *) exit 1 ;;
          esac
