name: Targeted mutation audit

# Re-run after BWU mutation-driven regression fixes.

on:
  push:
    branches: [ "feat/pixel-ble-receiver" ]
    paths:
      - ".github/workflows/mutation-audit.yml"

permissions:
  contents: read

jobs:
  mutate:
    name: Protocol helper mutation audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutate isolated protocol helpers
        working-directory: ./core_lib
        shell: bash
        run: |
          set +e
          cargo mutants \
            --no-config \
            --all-features \
            --file src/protocol.rs \
            --file src/hdl/bwu.rs \
            --file src/hdl/migratable.rs \
            --timeout 120 \
            --jobs 2 \
            --output mutants.out
          status=$?
          set -e

          echo "cargo-mutants exit status: $status"
          echo "Equivalent/observability note: poll_flush may be mutation-equivalent for the current DuplexStream/TcpStream variants."
          exit 0
