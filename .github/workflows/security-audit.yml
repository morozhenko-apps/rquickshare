name: Security audit

on:
  push:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0
      - name: Audit frontend lockfile
        working-directory: ./app/main
        run: pnpm audit --audit-level high

  rust:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit core lockfile
        run: cargo audit --file core_lib/Cargo.lock
      - name: Audit Tauri lockfile
        run: cargo audit --file app/main/src-tauri/Cargo.lock
