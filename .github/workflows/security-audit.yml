name: Security audit

on:
  push:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/security-audit.yml"
      - "app/main/package.json"
      - "app/main/pnpm-lock.yaml"
      - "app/main/src-tauri/Cargo.toml"
      - "app/main/src-tauri/Cargo.lock"
      - "core_lib/Cargo.toml"
      - "core_lib/Cargo.lock"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  javascript:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0
      - name: Audit runtime dependencies
        working-directory: ./app/main
        run: pnpm audit --prod --audit-level high
      # Tailwind CSS 3 currently pulls braces 3.0.3 through its build-only watcher
      # chain. GHSA-vfj7-8cjw-p6xm has no patched braces release. Keep reporting
      # the full toolchain, but block releases on the runtime audit above.
      - name: Audit full frontend toolchain
        continue-on-error: true
        working-directory: ./app/main
        run: pnpm audit --audit-level high

  rust:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit both Rust lockfiles
        run: |
          set +e
          cargo audit --file core_lib/Cargo.lock
          core_status=$?
          cargo audit --file app/main/src-tauri/Cargo.lock
          tauri_status=$?
          if [ "$core_status" -ne 0 ] || [ "$tauri_status" -ne 0 ]; then
            exit 1
          fi
