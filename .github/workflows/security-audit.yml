name: Security audit

on:
  push:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/security-audit.yml"
      - "app/main/package.json"
      - "app/main/pnpm-lock.yaml"
      - "app/main/src-tauri/Cargo.toml"
      - "app/main/src-tauri/Cargo.lock"
      - "core_lib/Cargo.toml"
      - "core_lib/Cargo.lock"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0
      - name: Audit runtime dependencies
        working-directory: ./app/main
        run: pnpm audit --prod --audit-level high
      - name: Audit full frontend toolchain
        working-directory: ./app/main
        run: pnpm audit --audit-level high

  rust:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit both Rust lockfiles
        run: |
          set +e
          cargo audit --file core_lib/Cargo.lock
          core_status=$?
          cargo audit --file app/main/src-tauri/Cargo.lock
          tauri_status=$?
          if [ "$core_status" -ne 0 ] || [ "$tauri_status" -ne 0 ]; then
            exit 1
          fi
