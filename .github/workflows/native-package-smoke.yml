name: Native Linux package smoke

# Deliberate candidate-only gate. The CI cadence policy forbids dev push triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_debian:
    runs-on: ubuntu-26.04
    # Build and test directly on the target ABI; no nested Docker namespace restriction.
    steps:
      - name: Install native build and isolated-check prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl build-essential pkg-config dpkg-dev python3 python3-venv \
            protobuf-compiler libdbus-1-dev libudev-dev libgtk-4-dev \
            libgtk4-layer-shell-dev libfontconfig-dev libseccomp-dev bubblewrap glycin-loaders \
            dbus-daemon dbus-x11 xvfb xauth desktop-file-utils gnupg gpgv

      - name: Require real unprivileged Bubblewrap sandbox on native Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$VERSION_ID" = "26.04"
          test "$(id -u)" -ne 0
          # The real Glycin loader needs user, PID and mount namespaces.
          bwrap --die-with-parent --unshare-user --unshare-pid \
            --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - uses: actions/checkout@v5

      - name: Install isolated publication contract-test dependencies (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/native-publication-python"
          "$RUNNER_TEMP/native-publication-python/bin/python" -m pip install -r scripts/requirements-r2.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2.9.0
        with:
          workspaces: |
            core_lib -> target
            native_desktop -> target
          shared-key: native-ubuntu-26.04

      - name: Core and package quality gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/core_lib/target/disk-test-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/core_lib/target/disk-test-tmp"
          cargo +nightly fmt --manifest-path core_lib/Cargo.toml -- --check
          cargo +nightly fmt --manifest-path native_desktop/Cargo.toml -- --check
          cargo +stable test --locked --manifest-path core_lib/Cargo.toml
          cargo +stable clippy --locked --manifest-path core_lib/Cargo.toml --all-targets -- -D warnings
          # Test-only GPG homes need short Unix socket paths for gpg-agent.
          # Keep Rust's workspace TMPDIR for disk capacity, but isolate Python fixtures.
          TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/native-publication-python/bin/python" -m unittest discover -s scripts/tests -p 'test_native_*.py' -v
          desktop-file-validate native_desktop/packaging/share/applications/io.github.morozhenko_apps.RQuickShare.desktop

      - name: Isolated GTK and native lint gate
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$GITHUB_WORKSPACE/core_lib/target/disk-test-tmp"
          cargo +stable build --locked --manifest-path native_desktop/Cargo.toml --bin rquickshare-preview-helper
          # Real sandbox smoke fails on an incapable runner; never disable Bwrap.
          GTK_A11Y=none GDK_BACKEND=x11 GSK_RENDERER=cairo \
            dbus-run-session --config-file docs/prototypes/preview-bus.conf -- \
            xvfb-run -a cargo +stable test --locked --manifest-path native_desktop/Cargo.toml
          cargo +stable clippy --locked --manifest-path native_desktop/Cargo.toml --all-targets --no-deps -- -D warnings

      - name: Build and verify uninstalled native release package
        run: python3 scripts/native_deb.py build --output "$RUNNER_TEMP/native-packages"

      - name: Prepare unsigned native APT staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native_apt.py prepare \
            --package "$RUNNER_TEMP/native-packages/"*.deb \
            --output "$RUNNER_TEMP/native-apt-unsigned"

      - name: Upload verified native release artifact
        uses: actions/upload-artifact@v6
        with:
          name: rquickshare-native-ubuntu-26.04
          path: |
            ${{ runner.temp }}/native-packages/*.deb
            ${{ runner.temp }}/native-packages/*.deb.sha256
          if-no-files-found: error

      - name: Upload unsigned APT staging artifact (not a published repository)
        uses: actions/upload-artifact@v6
        with:
          name: UNSIGNED-rquickshare-native-ubuntu26.04
          path: ${{ runner.temp }}/native-apt-unsigned/
          if-no-files-found: error
