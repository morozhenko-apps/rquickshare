name: Coverage baseline

on:
  push:
    branches: [ "feat/pixel-ble-receiver" ]
    paths:
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libdbus-1-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure core coverage
        working-directory: ./core_lib
        run: |
          cargo llvm-cov             --all-features             --summary-only             --ignore-filename-regex 'target/|bindings/'

  frontend:
    name: Frontend coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Measure frontend coverage
        working-directory: ./app/main
        run: |
          pnpm exec vitest run             --coverage             --coverage.provider=v8             --coverage.reporter=text             --coverage.include='src/**/*.{ts,vue}'             --coverage.exclude='src/auto-imports.d.ts'
