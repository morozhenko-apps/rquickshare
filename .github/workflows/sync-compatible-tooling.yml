name: Sync compatible frontend tooling

on:
  push:
    branches: [ "dev" ]
    paths:
      - "app/main/package.json"

permissions:
  contents: write

concurrency:
  group: sync-compatible-frontend-tooling
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0
      - name: Update within declared compatible ranges
        working-directory: ./app/main
        run: pnpm update --lockfile-only
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- app/main/pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main/pnpm-lock.yaml
          git commit -m "chore(deps): update compatible frontend tooling"
          git push origin HEAD:dev
